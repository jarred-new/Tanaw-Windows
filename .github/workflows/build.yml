name: Build Tanaw

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64

    runs-on: windows-2022

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # Install Qt
      # ----------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64

          modules: >
            qtmultimedia
            qtshadertools

          cache: true


      # ----------------------------------------
      # Setup MSVC
      # ----------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1


      # ----------------------------------------
      # Configure
      # ----------------------------------------
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"


      # ----------------------------------------
      # Build
      # ----------------------------------------
      - name: Build Tanaw
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel


      # ----------------------------------------
      # Check executable
      # ----------------------------------------
      - name: Check executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\Tanaw.exe")) {
              Write-Error "Tanaw.exe was not found!"
              exit 1
          }

          Write-Host "Found Tanaw.exe"


      # ----------------------------------------
      # Deploy Qt
      # ----------------------------------------
      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path package

          windeployqt `
            --release `
            --qmldir . `
            --dir package `
            "build\Release\Tanaw.exe"


      # ----------------------------------------
      # Copy executable
      # ----------------------------------------
      - name: Copy application
        shell: pwsh
        run: |
          Copy-Item `
            "build\Release\Tanaw.exe" `
            "package\Tanaw.exe"

      # ----------------------------------------
      # Upload artifact
      # ----------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanaw-Windows-x64
          path: "package/*"

